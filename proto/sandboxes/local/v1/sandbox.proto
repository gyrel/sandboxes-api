syntax = "proto3";

package sandboxes.local.v1;

option go_package = "github.com/gyrel/sandboxes-api/gen/go/sandboxes/local/v1;localv1";

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_PENDING = 1;
  SANDBOX_STATE_CREATING = 2;
  SANDBOX_STATE_RUNNING = 3;
  SANDBOX_STATE_STOPPING = 4;
  SANDBOX_STATE_STOPPED = 5;
  SANDBOX_STATE_DELETING = 6;
  SANDBOX_STATE_DELETED = 7;
  SANDBOX_STATE_FAILED = 8;
  SANDBOX_STATE_UNKNOWN = 9;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_CREATE = 1;
  OPERATION_KIND_START = 2;
  OPERATION_KIND_STOP = 3;
  OPERATION_KIND_DELETE = 4;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_DONE = 3;
  OPERATION_STATE_FAILED = 4;
}

enum RegistryCredentialScope {
  REGISTRY_CREDENTIAL_SCOPE_UNSPECIFIED = 0;
  REGISTRY_CREDENTIAL_SCOPE_HOST_ONLY = 1;
  REGISTRY_CREDENTIAL_SCOPE_ALL_SANDBOXES = 2;
  REGISTRY_CREDENTIAL_SCOPE_SANDBOX = 3;
}

message NetworkRule {
  string protocol = 1;
  string cidr = 2;
  uint32 port = 3;
  // Domain, wildcard (*.example.com), multi-label wildcard (**.example.com),
  // or a single-label glob. Mutually exclusive with cidr.
  string domain = 4;
  // Stable content-derived identifier for policy listing and removal.
  string rule_id = 5;
  // Origin names where the rule came from: "local" for daemon- or
  // sandbox-scoped rules, "org" for a signed organization policy bundle.
  // Older daemons leave this empty, which clients must treat as local.
  string origin = 6;
  // Methods restrict the rule to specific HTTP request methods (case-
  // insensitive, canonicalized upper-case by the daemon; "ANY" matches every
  // method but still marks the rule as HTTP-conditioned). Empty means no HTTP
  // condition. Daemons at contract 0.0.31+ validate and enforce these via the
  // gateway policy engine; older daemons reject rules carrying any HTTP
  // condition (fail closed) rather than silently ignoring it.
  repeated string methods = 7;
  // Path is a glob pattern over the percent-decoded request path. Segment
  // boundaries are literal; "**" spans segments, "*" does not. Empty means no
  // condition. A rule with an unevaluable path is refused at mutation time.
  string path = 8;
  // Query lists parameter conditions; every condition must match (name is
  // exact, value is a glob over a decoded value). Multiple values for one name
  // match when any value matches. Empty means no condition.
  repeated HTTPQueryCondition query = 9;
}

// HTTPQueryCondition requires one HTTP query parameter name with a value
// matching the supplied glob pattern.
message HTTPQueryCondition {
  string name = 1;
  string value = 2;
}

message Port {
  uint32 host = 1;
  uint32 guest = 2;
  string protocol = 3;
  string host_ip = 4;
}

message Workspace {
  // Host path to expose. The daemon must validate this path before mounting it.
  string path = 1;
  bool read_only = 2;
  // Absolute destination in the guest. Empty preserves the legacy behavior of
  // mounting Path at the same absolute path. The daemon must reject invalid or
  // conflicting guest destinations before creating a sandbox.
  string guest_path = 3;
}

message Sandbox {
  string id = 1;
  string name = 2;
  SandboxState state = 3;
  int64 generation = 4;
  string image = 5;
  string workspace = 6;
  string error = 7;
  int64 created_at_unix = 8;
  int64 updated_at_unix = 9;
  uint32 cpus = 10;
  uint32 memory_mib = 11;
  int64 stopped_at_unix = 12;
  repeated Workspace workspaces = 13;
  repeated Port ports = 14;
  repeated NetworkRule allow = 15;
  repeated NetworkRule deny = 16;
  string agent = 17;
  bool detached = 18;
  int64 last_used_at_unix = 19;
  int64 last_used_at_unix_nano = 20;
  string policy_profile = 21;
  // Clone metadata. GitEndpoint is present only while the guest is running.
  CloneInfo clone_info = 22;
  // Shared skills configuration selected when the sandbox was created.
  SkillsOptions skills = 23;
}

// Progress carries a transient, human-resumable view of a long-running
// operation phase. It is advisory display data, never an authorization or
// state signal: consumers must key lifecycle off Operation.state.
message Progress {
  // Machine-readable phase, e.g. "pulling", "finalizing", "starting". Empty
  // means no progress is currently known.
  string phase = 1;
  int64 completed = 2;
  int64 total = 3;
}

message Operation {
  string id = 1;
  string sandbox_id = 2;
  OperationKind kind = 3;
  OperationState state = 4;
  int64 generation = 5;
  string error = 6;
  int64 created_at_unix = 7;
  int64 updated_at_unix = 8;
  // Transient progress for in-flight operations. Absent for daemons predating
  // contract 0.0.26 and for terminal operations.
  Progress progress = 9;
}

message CreateRequest {
  string name = 1;
  string image = 2;
  string workspace = 3;
  string idempotency_key = 4;
  // Zero selects the daemon default for each resource.
  uint32 cpus = 5;
  uint32 memory_mib = 6;
  repeated Workspace workspaces = 7;
  repeated Port ports = 8;
  repeated NetworkRule allow = 9;
  repeated NetworkRule deny = 10;
  string agent = 11;
  bool detached = 12;
  // Environment baked into the sandbox for every process, including exec.
  // Values are not persisted in sandbox state.
  map<string, string> env = 13;
  string policy_profile = 14;
  // Runs the sandbox with the dedicated privileged Docker profile.
  bool privileged = 15;
  // OAuth kit metadata only; never put real access or refresh tokens here.
  repeated OAuthCredential oauth_credentials = 16;
  // Clone an existing workspace into an isolated guest workspace.
  CloneOptions clone = 17;
  // Omitted means shared skills are disabled. The daemon must reject unknown
  // modes and cannot silently downgrade a requested read-only mount.
  SkillsOptions skills = 18;
}

enum SkillsMode {
  SKILLS_MODE_UNSPECIFIED = 0;
  SKILLS_MODE_OFF = 1;
  SKILLS_MODE_READONLY = 2;
  SKILLS_MODE_READWRITE = 3;
}

// SkillsOptions grants a sandbox access to a host skills store. The store path
// is host-side only and must be a real directory. Read-write access allows the
// guest to alter skills consumed by other sandboxes. Off requires an empty path.
message SkillsOptions {
  SkillsMode mode = 1;
  string store_path = 2;
}

// CloneOptions describes the host source workspace and optional guest working
// directory for clone mode. A missing guest_workdir lets the daemon choose it.
message CloneOptions {
  string source_workspace_path = 1;
  optional string guest_workdir = 2;
}

// CloneInfo is the guest-visible clone identity returned with a Sandbox.
message CloneInfo {
  string guest_workdir = 1;
  string remote_name = 2;
  // Absent when the sandbox is stopped or no guest endpoint is available.
  GitEndpoint git_endpoint = 3;
}

message GitEndpoint {
  string host_ip = 1;
  uint32 port = 2;
  string repository = 3;
}

// OAuthCredential mirrors the Docker Sandboxes v2 OAuth kit declaration.
// Values are configuration metadata; real tokens remain host-side unless the
// explicitly weaker passthrough mode is selected.
message OAuthCredential {
  string service = 1;
  OAuthTokenEndpoint token_endpoint = 2;
  repeated string resource_hosts = 3;
  OAuthSentinels sentinels = 4;
  OAuthCredentialFile credential_file = 5;
  OAuthResponseFields response_fields = 6;
  bool passthrough = 7;
  // Carried for Docker v2 schema compatibility; it does not grant access.
  repeated string skip_if_env = 8;
}

message OAuthTokenEndpoint {
  string host = 1;
  string path = 2;
}

message OAuthSentinels {
  string access_token = 1;
  string refresh_token = 2;
}

message OAuthCredentialFile {
  string path = 1;
  // JSON-encoded structure object; structure takes precedence over template.
  string structure_json = 2;
  string template = 3;
}

message OAuthResponseFields {
  string access_token = 1;
  string refresh_token = 2;
  string expires_in = 3;
  string scope = 4;
  string id_token = 5;
}

message GetRequest {
  string id = 1;
}

message ListRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message GetResponse {
  Sandbox sandbox = 1;
}

message ListResponse {
  repeated Sandbox items = 1;
  string next_page_token = 2;
}

message StartRequest {
  string id = 1;
}

message StopRequest {
  string id = 1;
  int64 grace_seconds = 2;
}

message DeleteRequest {
  string id = 1;
  bool force = 2;
}

message OperationServiceGetRequest {
  string id = 1;
}

message OperationServiceWaitRequest {
  string id = 1;
}

message WatchRequest {
  string sandbox_id = 1;
  int64 after_revision = 2;
}

message WatchResponse {
  string type = 1;
  Sandbox sandbox = 2;
  Operation operation = 3;
  int64 revision = 4;
}

message CreateResponse {
  Operation operation = 1;
}

message StartResponse {
  Operation operation = 1;
}

message StopResponse {
  Operation operation = 1;
}

message DeleteResponse {
  Operation operation = 1;
}

message ExecRequest {
  string sandbox_id = 1;
  repeated string argv = 2;
  string workdir = 3;
  // Explicit KEY=VALUE overrides. Host environment variables are never copied.
  repeated string env = 4;
  // Numeric uid[:gid] or local guest user/group names when supported by the guest.
  string user = 5;
}

message ExecResponse {
  oneof frame {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
}

// The first frame opens a session. Subsequent frames carry input, terminal
// resize events, or an explicit stdin EOF.
message ExecSessionOpen {
  string sandbox_id = 1;
  repeated string argv = 2;
  string workdir = 3;
  bool tty = 4;
  uint32 rows = 5;
  uint32 cols = 6;
  // Explicit KEY=VALUE overrides. Host environment variables are never copied.
  repeated string env = 7;
  // Numeric uid[:gid] or local guest user/group names when supported by the guest.
  string user = 8;
}

message ExecSessionResize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecSessionRequest {
  oneof frame {
    ExecSessionOpen open = 1;
    bytes stdin = 2;
    ExecSessionResize resize = 3;
    bool stdin_eof = 4;
  }
}

message ExecSessionResponse {
  oneof frame {
    bytes stdout = 1;
    bytes stderr = 2;
    int32 exit_code = 3;
  }
}

message OperationServiceGetResponse {
  Operation operation = 1;
}

message OperationServiceWaitResponse {
  Operation operation = 1;
}

message RegistryCredentialServiceLoginRequest {
  string registry = 1;
  string username = 2;
  bytes password = 3;
  RegistryCredentialScope scope = 4;
  string sandbox_name = 5;
}

message RegistryCredentialServiceLoginResponse {
  string registry = 1;
  string username = 2;
  RegistryCredentialScope scope = 3;
  string sandbox_name = 4;
}

message RegistryCredentialServiceLogoutRequest {
  string registry = 1;
  RegistryCredentialScope scope = 2;
  string sandbox_name = 3;
}

message RegistryCredentialServiceListRequest {}

message RegistryCredentialSummary {
  string registry = 1;
  string username = 2;
  string scope = 3;
  string sandbox_name = 4;
  // Non-secret metadata for machine-readable inventories. Zero timestamps
  // mean the daemon does not know when an older entry was written.
  int64 created_at_unix = 5;
  int64 updated_at_unix = 6;
  // Origin names where the entry came from. The local daemon currently writes
  // "local"; clients must treat an empty value as local.
  string origin = 7;
}

message RegistryCredentialServiceListResponse {
  repeated RegistryCredentialSummary credentials = 1;
}

message RegistryCredentialServiceLogoutResponse {
  bool removed = 1;
}

// SecretSource stores a host-side resolver configuration instead of a
// credential value. A command is user-supplied host shell text and is replayed
// by the daemon on verification/refresh. This message must never be sent to a guest.
message SecretSource {
  string reference = 1;
  string refresh = 2;
  bool no_verify = 3;
  bool show_error = 4;
  string command = 5;
  string op_account = 6;
  string aws_profile = 7;
}

message SecretServiceSetRequest {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
  bytes value = 4;
  SecretSource source = 5;
}

message SecretSummary {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
  // Non-secret metadata for machine-readable inventories. Zero timestamps
  // mean the daemon does not know when an older entry was written.
  int64 created_at_unix = 4;
  int64 updated_at_unix = 5;
  // SourceKind is "value", "reference" or "command". SecretType is a coarse
  // value type such as "api_key". Neither field contains secret material.
  string source_kind = 6;
  string refresh = 7;
  bool refreshable = 8;
  string secret_type = 9;
  // Origin names where the entry came from. The local daemon currently writes
  // "local"; clients must treat an empty value as local.
  string origin = 10;
  // Custom-secret placement metadata, empty for service secrets. EnvName and
  // Hosts are non-secret configuration. PlaceholderMasked is a fixed-width mask
  // that reveals at most the last four characters of the placeholder; the full
  // placeholder is never returned.
  string env_name = 11;
  repeated string hosts = 12;
  string placeholder_masked = 13;
}

message SecretServiceSetResponse {
  SecretSummary secret = 1;
}

message SecretServiceCreateRequest {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
  bytes value = 4;
  SecretSource source = 5;
}

message SecretServiceCreateResponse {
  SecretSummary secret = 1;
}

message SecretServiceListRequest {}

message SecretServiceListResponse {
  repeated SecretSummary secrets = 1;
}

message SecretServiceRemoveRequest {
  string service = 1;
  string scope = 2;
  string sandbox_name = 3;
}

message SecretServiceRemoveResponse {
  bool removed = 1;
}

// SecretServiceSetCustomRequest creates or updates a custom secret that a
// sandbox uses through a placeholder. The sandbox receives only the placeholder
// in the Env variable. For requests to matching Hosts, the host proxy replaces
// the placeholder in request headers with the real secret, so the real value
// never enters the guest. Gyrel is vault-only: there are no literal header
// values.
// Set exactly one of Value (inline, write-only, stored host-side) or Source
// with a Reference or Command. Reference and command sources are resolved on
// the host, and their first resolution requires a trusted host approval. A
// daemon without a trusted OS-backed approval provider MUST fail closed for
// these sources. Source.no_verify skips the initial resolver check but never
// skips approval. Source.refresh is "on-demand" (the default when empty) or a
// duration. The Value and resolver output never appear in responses, logs or
// SQLite state, and placeholders are never returned in full.
message SecretServiceSetCustomRequest {
  // Service identity. When empty, the daemon derives it from the first host and
  // returns the resolved name in SecretSummary.service.
  string service = 1;
  // Scope and sandbox_name use the same key semantics as
  // SecretServiceSetRequest. An empty sandbox_name selects the global scope.
  string scope = 2;
  string sandbox_name = 3;
  // Inline secret value. Write-only: it is stored host-side and never echoed.
  bytes value = 4;
  SecretSource source = 5;
  // Sandbox environment variable that receives the placeholder value.
  string env = 6;
  // Explicit placeholder, or a template with a {rand} suffix that the daemon
  // replaces with random characters. When empty, the daemon generates a unique
  // placeholder. A placeholder must not contain or equal the real secret.
  // Placeholders are not authority: they only select a vault entry for
  // substitution on matching hosts.
  string placeholder = 7;
  // Exact DNS names, IP literals, or wildcard patterns, repeatable. "*"
  // matches one label (*.example.com covers cli.example.com) and "**" matches
  // any number of labels. The proxy substitutes only for matching hosts.
  repeated string hosts = 8;
}

// SecretServiceSetCustomResponse never contains the secret value or resolver
// text. Secret is empty while approval is pending.
message SecretServiceSetCustomResponse {
  SecretSummary secret = 1;
  // ApprovalRequired is true when a reference or command source waits for host
  // approval. The secret is not stored until ApprovalService.Respond approves
  // ApprovalID. This mirrors the MCP registration challenge pattern.
  bool approval_required = 2;
  string approval_id = 3;
  // Placeholder is the resolved placeholder in full, returned only on this
  // write path so the CLI can show it (the baseline prints the generated
  // value; owner decision 2026-11-24). This adds no exposure: the same string
  // is injected into the sandbox environment for this secret and it is not
  // authority. Inventories (SecretSummary) keep only PlaceholderMasked;
  // responses for pending approvals leave this empty.
  string placeholder = 4;
}

message AccountServiceLoginRequest {
  string provider = 1;
}

message AccountServiceLoginResponse {
  string provider = 1;
  bool authenticated = 2;
}

message AccountServiceLoginWithPATRequest {
  string username = 1;
  bytes password = 2;
}

message AccountServiceLoginWithPATResponse {
  bool authenticated = 1;
}

message AccountServiceLogoutRequest {
  string provider = 1;
}

message AccountServiceLogoutResponse {
  bool removed = 1;
}

message AccountServiceStatusRequest {
  string provider = 1;
}

message AccountServiceStatusResponse {
  string provider = 1;
  bool credential_present = 2;
  // refresh_present reports that a usable refresh token is stored, without
  // exposing token material, expiry values or validity claims.
  bool refresh_present = 3;
  // refresh_coordinated reports that the daemon coordinates refresh for this
  // credential (single-flight rotation); false means no refresh is scheduled.
  bool refresh_coordinated = 4;
  // username is the signed-in account label when the daemon stored one at
  // login (device OAuth or Docker Hub PAT). It is a display identity, not a
  // secret; token material and expiry remain unexposed. Empty for daemons
  // predating contract 0.0.30 and providers without a stored label.
  string username = 5;
}

// The device-login stream keeps the device code on the daemon. The user code
// and verification URL are intentionally returned so the caller can complete
// the provider's interactive handoff before polling begins.
message AccountServiceLoginDeviceRequest {
  string provider = 1;
  bool continue_after_handoff = 2;
}

message AccountServiceLoginDeviceResponse {
  string user_code = 1;
  string verification_uri = 2;
  bool authenticated = 3;
}

message UpdatePolicyRequest {
  string id = 1;
  repeated NetworkRule allow = 2;
  repeated NetworkRule deny = 3;
}

message UpdatePolicyResponse {
  Sandbox sandbox = 1;
}

message MutatePolicyRequest {
  string id = 1;
  string action = 2;
  NetworkRule rule = 3;
}

message MutatePolicyResponse {
  Sandbox sandbox = 1;
}

message UpdatePortsRequest {
  string id = 1;
  repeated Port ports = 2;
}

message UpdatePortsResponse {
  Sandbox sandbox = 1;
}

message GetGlobalPolicyRequest {}

message GetGlobalPolicyResponse {
  repeated NetworkRule allow = 1;
  repeated NetworkRule deny = 2;
}

message MutateGlobalPolicyRequest {
  string action = 1;
  NetworkRule rule = 2;
}

message MutateGlobalPolicyResponse {
  repeated NetworkRule allow = 1;
  repeated NetworkRule deny = 2;
}

message RefreshPoliciesRequest {}

message RefreshPoliciesResponse {
  // applied is the number of running sandboxes that accepted the refresh.
  int32 applied = 1;
  // skipped is the number of sandboxes that did not need a refresh.
  int32 skipped = 2;
}

message ResetGlobalPolicyRequest {}

message ResetGlobalPolicyResponse {
  repeated NetworkRule allow = 1;
  repeated NetworkRule deny = 2;
  string profile = 3;
}

// OrgPolicyRule is one rule from the locally stored, signed organization
// policy bundle. It contains only non-secret policy metadata and the parsed
// network target. Rules that this daemon does not enforce remain advisory and
// carry a human-readable advisory_reason.
message OrgPolicyRule {
  string rule_id = 1;
  // Action is "allow" or "deny".
  string action = 2;
  // Source is always "org"; the field makes mixed listings unambiguous.
  string source = 3;
  // ResourceType is "network" for rules in this contract version.
  string resource_type = 4;
  // Protocol is "tcp" or "udp" for enforced deny rules expanded by the
  // daemon. Advisory organization allow rules leave it empty.
  string protocol = 5;
  string cidr = 6;
  string domain = 7;
  uint32 port = 8;
  // Enforced reports whether the daemon applies this rule now. It is false
  // when org_policy.enforce is off or when the rule is advisory.
  bool enforced = 9;
  // AdvisoryReason explains why an advisory rule is not enforced.
  string advisory_reason = 10;
}

message GetOrgPolicyRequest {}

// GetOrgPolicyResponse is a read-only, side-effect-free view of the stored
// organization policy bundle. It never includes signatures, tokens, vault
// material or any other secret value.
message GetOrgPolicyResponse {
  string org = 1;
  // SchemaVersion and Revision identify the bundle contract and its monotonic
  // revision. Both are zero when older stores do not provide them.
  uint32 schema_version = 2;
  uint64 revision = 3;
  // BundleID is a stable SHA-256 fingerprint of the stored payload, formatted
  // as "sha256:<hex>".
  string bundle_id = 4;
  bool enforcement_enabled = 5;
  int64 loaded_at_unix = 6;
  int64 issued_at_unix = 7;
  int64 expires_at_unix = 8;
  repeated OrgPolicyRule rules = 9;
  // IgnoredRules counts stored rules that this contract version does not
  // display or enforce: non-network resources and malformed advisory allows.
  int32 ignored_rules = 10;
}

message CheckPolicyRequest {
  string sandbox_id = 1;
  string protocol = 2;
  string address = 3;
  string domain = 4;
  uint32 port = 5;
  // Url, when set, describes an HTTP(S) request target for L7 evaluation
  // (matches the `policy check network` URL grammar): the daemon parses it
  // into host/port/path/query and applies the effective policy. It must be a
  // bare absolute URL without credentials, fragment or unsafe characters;
  // clients must not send secrets in it and daemons must not log the query.
  string url = 6;
  // Method optionally names the HTTP method for a URL check. Without it,
  // rules conditioned on specific methods cannot be evaluated and fail to
  // match (fail closed); ANY matches every method condition.
  string method = 7;
}

message CheckPolicyResponse {
  bool allowed = 1;
  string rule_id = 2;
  string reason = 3;
}

// MCPCall invokes one tool on an MCP server registered for a sandbox. The
// daemon resolves the server from its own registry, verifies that the sandbox
// is running, and obtains any required approval through a trusted host
// provider. Client input is never an approval grant or an executable command.
// Deployments must enforce applicable policy before host execution; this RPC
// does not itself define or evaluate an MCP policy.
message MCPCallRequest {
  string sandbox_id = 1;
  string server_name = 2;
  string tool_name = 3;
  // UTF-8 JSON object containing tool arguments, at most 1 MiB. The daemon
  // validates the JSON before forwarding it.
  string arguments_json = 4;
}

message MCPCallResponse {
  // UTF-8 JSON tool result, at most 4 MiB.
  string result_json = 1;
  // When true, the daemon created a short-lived one-use approval challenge.
  // No tool was executed and result_json is empty. Clients must display the
  // challenge to the user and call MCPApproveCall before returning a result.
  bool approval_required = 2;
  string approval_id = 3;
  // Human-readable, non-secret explanation for the approval prompt.
  string approval_reason = 4;
}

message MCPApproveCallRequest {
  // One-use daemon-issued challenge returned by MCPCall. This only selects
  // the pending operation; it is not proof of user approval. The daemon must
  // obtain approval through its trusted host approval provider before execution.
  string approval_id = 1;
  reserved 2;
}

message MCPApproveCallResponse {
  // UTF-8 JSON tool result, at most 4 MiB when approved and executed.
  string result_json = 1;
}

message MCPRegisterServerRequest {
  string name = 1;
  // Explicit host executable path; never interpreted by a shell. Exactly one
  // of command or url must be set.
  string command = 2;
  // Non-secret command configuration only. Daemon registry metadata is stored
  // in local state; credentials must use a host credential broker instead.
  repeated string arguments = 3;
  // Absolute host working directory. The daemon validates and pins its
  // identity before launching this command.
  string working_directory = 4;
  // Remote streamable-HTTP transport: an https URL constrained by the
  // daemon's fail-closed host allowlist. Exactly one of command or url must
  // be set.
  string url = 5;
  // Deprecated: static remote request headers are rejected by supported
  // daemons because sensitivity cannot be inferred from a custom header name.
  // Use secret_headers with host-vault placeholder references.
  map<string, string> headers = 6;
  // Host-vault-backed request header templates. Values may contain only
  // literal formatting text and ${placeholder} references; secret material
  // itself must never cross this RPC or be persisted in registry state.
  map<string, string> secret_headers = 7;
  // RFC 8414 authorization-server metadata: a path or http(s) URL to an
  // oauth-authorization-server document (captured add grammar
  // --oauth-authorization-server). Applies to url transports only.
  string oauth_authorization_server = 8;
  // Pre-registered OAuth client id (captured --client-id). A confidential
  // client's secret comes from the host vault
  // (secret set mcp:<server>:client_secret), never from this RPC.
  string client_id = 9;
  // RFC 8707 resource indicator (absolute URI, scheme+host, no fragment;
  // captured --resource) overriding the server-published value.
  string resource = 10;
  // Default OAuth scopes requested at consent time (captured --scope,
  // repeatable). Mutually exclusive with no_scope.
  repeated string scopes = 11;
  // Suppress all scope fallbacks so the authorization server applies its own
  // default grant (captured --no-scope). Cannot be combined with scopes.
  bool no_scope = 12;
  // Register an OAuth server without starting the hosted flow (captured
  // --skip-auth).
  bool skip_auth = 13;
  // Local port for the add-time OAuth callback listener (captured
  // --callback-port; 0 means OS-assigned). Applies to url transports.
  int32 callback_port = 14;
  // Disable HTTP/2 negotiation for this remote server, leaving HTTP/1.1
  // (captured --disable-http2). Applies to url transports.
  bool disable_http2 = 15;
  // deferred (security): captured --local runs the registry OCI server via
  // `docker run`; host Docker invocation conflicts with AGENTS §8 (no host
  // Docker socket, fail-closed network). Modeled only after a dedicated
  // security design; daemons must reject clients that request it (no field
  // exists to request it).
  // deferred (security): captured --skip-ssrf-check disables SSRF checks for
  // the registration including OAuth metadata and redirects. Gyrel enforces
  // network fail-closed with no permissive fallback; the flag is NOT modeled
  // and the divergence is recorded as a release blocker candidate in PLAN §6.
  // deferred (design): the captured --url field accepts three forms (manifest
  // URL, remote endpoint URL, dhi.io image ref) in one string. This contract's
  // url = 5 documents remote endpoint semantics; manifest and dhi ref forms
  // are deferred until the daemon resolver distinguishes them (the field can
  // carry them; classification rules will be added daemon-side without a
  // schema change).
}

message MCPRegisterServerResponse {
  MCPServerSummary server = 1;
  // Registration never starts the server. Host process execution begins only
  // after the daemon's trusted host approval provider authorizes the challenge.
  bool approval_required = 2;
  string approval_id = 3;
}

message MCPApproveRegistrationRequest {
  // This selects the pending registration; it is not proof of user approval.
  // The daemon must consult its trusted host approval provider.
  string approval_id = 1;
  reserved 2;
}

message MCPApproveRegistrationResponse {
  MCPServerSummary server = 1;
}

message MCPRemoveServerRequest {
  string name = 1;
}

message MCPRemoveServerResponse {
  bool removed = 1;
}

// MCPServerSummary is a redacted view of a server in the daemon-owned registry.
// It intentionally excludes command arguments, headers, credentials, and
// OAuth identity details.
message MCPServerSummary {
  string name = 1;
  // gateway identifies the local gateway or remote control plane responsible
  // for the server; it is a display value, not an address or authorization.
  string gateway = 2;
  // transport is an extensible lowercase label such as stdio, streamable-http,
  // sse, or oci.
  string transport = 3;
  bool loaded = 4;
  bool usable = 5;
  bool auth_required = 6;
  bool auth_configured = 7;
  bool has_custom_headers = 8;
  bool custom_headers_supported = 9;
  bool custom_header_secrets_configured = 10;
}

// ListMCPServers returns only daemon-known MCP server summaries. It never
// starts servers or authentication flows. An optional sandbox ID limits the
// result to servers requested by that sandbox and includes skipped entries so
// callers can explain why a server is unavailable.
message ListMCPServersRequest {
  string sandbox_id = 1;
}

message ListMCPServersResponse {
  repeated MCPServerSummary servers = 1;
}

// deferred: Registry and manifest URL interpretation and static MCP configuration
// require a separate registration contract; existing url denotes a remote endpoint.
// deferred: OAuth discovery, dynamic registration and scope overrides require
// daemon-side policy and are not represented by this challenge contract.
enum MCPAuthStatus {
  MCP_AUTH_STATUS_UNSPECIFIED = 0;
  MCP_AUTH_STATUS_NOT_CONFIGURED = 1;
  MCP_AUTH_STATUS_READY = 2;
  MCP_AUTH_STATUS_PENDING_APPROVAL = 3;
  MCP_AUTH_STATUS_EXPIRED = 4;
  MCP_AUTH_STATUS_ERROR = 5;
}

enum MCPGatewayState {
  MCP_GATEWAY_STATE_UNSPECIFIED = 0;
  MCP_GATEWAY_STATE_UNLOADED = 1;
  MCP_GATEWAY_STATE_LOADED = 2;
}

message MCPLoadServerRequest {
  string name = 1;
  string sandbox_id = 2;
}
message MCPLoadServerResponse { bool loaded = 1; }
// Unload detaches the server from the sandbox gateway and prevents restoration
// on restart. The registry entry, vault references and approvals survive.
// Remove deletes the registration instead.
message MCPUnloadServerRequest {
  string name = 1;
  string sandbox_id = 2;
}
message MCPUnloadServerResponse { bool unloaded = 1; }
message InspectMCPServerRequest {
  string name = 1;
  // Empty selects global registry scope; otherwise inspect this sandbox.
  string sandbox_id = 2;
}
// Identity is non-secret subject display only: display name, kind and issuer
// host. Never return credentials, tokens, headers or arbitrary identity claims.
message MCPServerDetail {
  string name = 1;
  string sandbox_id = 2;
  string identity_display_name = 3;
  string identity_kind = 4;
  string identity_issuer_host = 5;
  uint32 tools_count = 6;
  int64 last_sync_at_unix = 7;
  MCPAuthStatus auth_status = 8;
  MCPGatewayState gateway_state = 9;
}
message InspectMCPServerResponse { MCPServerDetail server = 1; }
message GetMCPAuthStatusRequest {
  string name = 1;
  // Apply to all registered OAuth servers (captured auth status --all).
  bool all = 2;
}
// Status is read-only and never starts or refreshes authorization.
// MCPServerAuthStatus pairs one server name with its auth state for bulk
// reporting. It carries no token material.
message MCPServerAuthStatus {
  string name = 1;
  MCPAuthStatus status = 2;
}

message GetMCPAuthStatusResponse {
  // Populated for single-name requests.
  MCPAuthStatus status = 1;
  // Populated for all=true requests (one entry per registered OAuth server).
  repeated MCPServerAuthStatus entries = 2;
}
message RemoveMCPAuthRequest { string name = 1; }
// The daemon clears stored auth and invalidates live routes while retaining
// the registration. No credential material is returned.
message RemoveMCPAuthResponse { bool removed = 1; }
message StartMCPAuthRequest {
  string name = 1;
  string sandbox_id = 2;
  // Per-run scope overrides (captured mcp auth --scope/--no-scope); mutually
  // exclusive. Scope precedence rules are daemon-side and documented in the
  // captured help; the contract only transports the request.
  repeated string scopes = 3;
  bool no_scope = 4;
  // Apply to all registered OAuth servers (captured mcp auth --all).
  bool all = 5;
}
// The daemon owns discovery, registration and browser flow. ApprovalID selects
// a challenge, not proof of consent; poll GetMCPAuthStatus for completion.
message StartMCPAuthResponse {
  bool approval_required = 1;
  string approval_id = 2;
}

message GetVersionRequest {}

message GetVersionResponse {
  string version = 1;
  string api_version = 2;
}

service SandboxService {
  rpc Create(CreateRequest) returns (CreateResponse);
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Watch(WatchRequest) returns (stream WatchResponse);
  rpc Exec(ExecRequest) returns (stream ExecResponse);
  rpc ExecSession(stream ExecSessionRequest) returns (stream ExecSessionResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc MutatePolicy(MutatePolicyRequest) returns (MutatePolicyResponse);
  rpc UpdatePorts(UpdatePortsRequest) returns (UpdatePortsResponse);
  rpc GetPolicyProfile(GetPolicyProfileRequest) returns (GetPolicyProfileResponse);
  rpc SetPolicyProfile(SetPolicyProfileRequest) returns (SetPolicyProfileResponse);
  rpc GetGlobalPolicy(GetGlobalPolicyRequest) returns (GetGlobalPolicyResponse);
  rpc MutateGlobalPolicy(MutateGlobalPolicyRequest) returns (MutateGlobalPolicyResponse);
  rpc CheckPolicy(CheckPolicyRequest) returns (CheckPolicyResponse);
  rpc ListMCPServers(ListMCPServersRequest) returns (ListMCPServersResponse);
  rpc MCPRegisterServer(MCPRegisterServerRequest) returns (MCPRegisterServerResponse);
  rpc MCPApproveRegistration(MCPApproveRegistrationRequest) returns (MCPApproveRegistrationResponse);
  rpc MCPRemoveServer(MCPRemoveServerRequest) returns (MCPRemoveServerResponse);
  rpc MCPLoadServer(MCPLoadServerRequest) returns (MCPLoadServerResponse);
  rpc MCPUnloadServer(MCPUnloadServerRequest) returns (MCPUnloadServerResponse);
  rpc InspectMCPServer(InspectMCPServerRequest) returns (InspectMCPServerResponse);
  rpc GetMCPAuthStatus(GetMCPAuthStatusRequest) returns (GetMCPAuthStatusResponse);
  rpc RemoveMCPAuth(RemoveMCPAuthRequest) returns (RemoveMCPAuthResponse);
  rpc StartMCPAuth(StartMCPAuthRequest) returns (StartMCPAuthResponse);
  rpc MCPCall(MCPCallRequest) returns (MCPCallResponse);
  rpc MCPApproveCall(MCPApproveCallRequest) returns (MCPApproveCallResponse);
  rpc RefreshPolicies(RefreshPoliciesRequest) returns (RefreshPoliciesResponse);
  rpc ResetGlobalPolicy(ResetGlobalPolicyRequest) returns (ResetGlobalPolicyResponse);
  rpc GetOrgPolicy(GetOrgPolicyRequest) returns (GetOrgPolicyResponse);
}

message GetPolicyProfileRequest {}

message GetPolicyProfileResponse {
  string profile = 1;
}

message SetPolicyProfileRequest {
  string profile = 1;
}

message SetPolicyProfileResponse {
  string profile = 1;
}

service OperationService {
  rpc Get(OperationServiceGetRequest) returns (OperationServiceGetResponse);
  rpc Wait(OperationServiceWaitRequest) returns (OperationServiceWaitResponse);
}

service RegistryCredentialService {
  rpc Login(RegistryCredentialServiceLoginRequest) returns (RegistryCredentialServiceLoginResponse);
  rpc Logout(RegistryCredentialServiceLogoutRequest) returns (RegistryCredentialServiceLogoutResponse);
  rpc List(RegistryCredentialServiceListRequest) returns (RegistryCredentialServiceListResponse);
}

service SecretService {
  rpc Set(SecretServiceSetRequest) returns (SecretServiceSetResponse);
  rpc Create(SecretServiceCreateRequest) returns (SecretServiceCreateResponse);
  rpc List(SecretServiceListRequest) returns (SecretServiceListResponse);
  rpc Remove(SecretServiceRemoveRequest) returns (SecretServiceRemoveResponse);
  rpc SetCustom(SecretServiceSetCustomRequest) returns (SecretServiceSetCustomResponse);
}

service AccountService {
  rpc Login(AccountServiceLoginRequest) returns (AccountServiceLoginResponse);
  rpc LoginDevice(stream AccountServiceLoginDeviceRequest) returns (stream AccountServiceLoginDeviceResponse);
  rpc LoginWithPAT(AccountServiceLoginWithPATRequest) returns (AccountServiceLoginWithPATResponse);
  rpc Logout(AccountServiceLogoutRequest) returns (AccountServiceLogoutResponse);
  rpc Status(AccountServiceStatusRequest) returns (AccountServiceStatusResponse);
}

service TemplateService {
  rpc Save(TemplateServiceSaveRequest) returns (TemplateServiceSaveResponse);
  rpc Load(TemplateServiceLoadRequest) returns (TemplateServiceLoadResponse);
  rpc Remove(TemplateServiceRemoveRequest) returns (TemplateServiceRemoveResponse);
  rpc List(TemplateServiceListRequest) returns (TemplateServiceListResponse);
  rpc Inspect(TemplateServiceInspectRequest) returns (TemplateServiceInspectResponse);
  rpc Export(TemplateServiceExportRequest) returns (TemplateServiceExportResponse);
}

// Template records local template images produced by `template save`.
// Names follow the normalized docker.io/library grammar; digests address
// the assembled manifest.
message Template {
  string name = 1;
  string digest = 2;
  int64 size_bytes = 3;
  int64 created_unix = 4;
  // BaseImage is the image the recorded sandbox booted from.
  string base_image = 5;
  // Flavor carries the agent/template family inherited at save time.
  string flavor = 6;
  int32 layers = 7;
}

message TemplateServiceSaveRequest {
  string sandbox_id = 1;
  // Tag is the template name to create (normalized by the daemon).
  string tag = 2;
  // OutputPath optionally writes a docker-save compatible tar to the host
  // path after recording the template; empty means record only.
  string output_path = 3;
}

message TemplateServiceSaveResponse {
  Template template = 1;
  string output_path = 2;
  // Notice is operator-facing guidance echoed by the CLI (for example the
  // warning that guest-resident secrets are not exported). It never
  // contains secret material.
  string notice = 3;
}

message TemplateServiceLoadRequest {
  // TarPath is a host file with an OCI or docker-save template archive.
  string tar_path = 1;
  // Name optionally overrides the archive tag; empty keeps the archived
  // name.
  string name = 2;
}

message TemplateServiceLoadResponse {
  Template template = 1;
}

message TemplateServiceRemoveRequest {
  string name = 1;
  // Force skips the confirmation requirement encoded by callers; the
  // daemon refuses removals of templates referenced by existing sandboxes
  // regardless.
  bool force = 2;
}

message TemplateServiceRemoveResponse {}

message TemplateServiceListRequest {}

message TemplateServiceListResponse {
  repeated Template templates = 1;
}

message TemplateServiceInspectRequest {
  string name = 1;
}

message TemplateServiceExportRequest {
  string name = 1;
  // TarPath is the host destination for the docker-save archive; existing
  // files are never overwritten.
  string tar_path = 2;
}

message TemplateServiceExportResponse {
  int64 size_bytes = 1;
}

message TemplateServiceInspectResponse {
  Template template = 1;
  // Env, WorkingDir and User reconstruct the boot configuration. Env
  // values are names-only: entries that could carry credential material
  // are reported as NAME without a value (presence-only contract).
  repeated string env_names = 2;
  string working_dir = 3;
  string user = 4;
}

// ApprovalKind classifies a host-side consent request. Secret command sources
// use HOST_COMMAND and secret reference sources use OTHER. Daemons must map any
// unrecognized source to OTHER rather than inventing a new kind.
enum ApprovalKind {
  APPROVAL_KIND_UNSPECIFIED = 0;
  APPROVAL_KIND_HOST_COMMAND = 1;
  APPROVAL_KIND_MCP_REGISTRATION = 2;
  APPROVAL_KIND_MCP_CALL = 3;
  APPROVAL_KIND_OTHER = 4;
}

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_DENIED = 3;
}

// HeaderValueClass tells the user whether a header value comes from the host
// vault or is a literal. Gyrel is vault-only, so STATIC appears only to disclose
// a non-compliant literal that a daemon found; it is never a valid way to supply
// a value.
enum HeaderValueClass {
  HEADER_VALUE_CLASS_UNSPECIFIED = 0;
  HEADER_VALUE_CLASS_STATIC = 1;
  HEADER_VALUE_CLASS_VAULT = 2;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  APPROVAL_DECISION_APPROVE = 1;
  APPROVAL_DECISION_DENY = 2;
}

// ApprovalPersistScope selects whether a decision is stored as a rule. ONCE
// applies the decision to this approval only. EXACT stores a rule with the same
// decision for the approval's exact scope and requires a trusted OS-backed
// approval provider.
enum ApprovalPersistScope {
  APPROVAL_PERSIST_SCOPE_UNSPECIFIED = 0;
  APPROVAL_PERSIST_SCOPE_ONCE = 1;
  APPROVAL_PERSIST_SCOPE_EXACT = 2;
}

// ApprovalHeader names one request header that the approval would send. Only
// the name, its class and vault reference identifiers are disclosed. Header
// values never cross this contract.
message ApprovalHeader {
  string name = 1;
  HeaderValueClass value_class = 2;
  // Opaque identifiers of host-vault entries that supply the value. These are
  // identifiers, not secret material.
  repeated string vault_reference_ids = 3;
}

// Approval is a pending or recently resolved host-side consent request.
// Redaction obligations for every field: no value of any header, environment
// variable, secret or token may appear here. DestinationHost and
// DestinationPath carry no query, userinfo or fragment. ActionSummary,
// CwdSummary and EnvNames must be redacted by the daemon before they are sent. The ID is the
// challenge ID returned by SandboxService.MCPCall or MCPRegisterServer for MCP
// kinds. Command text and arguments are never disclosed, because they may
// contain secrets.
message Approval {
  string id = 1;
  ApprovalKind kind = 2;
  ApprovalState state = 3;
  // Requesting sandbox.
  string sandbox_id = 4;
  // Short, human-readable, non-secret description of the action.
  string action_summary = 5;
  // Normalized HTTPS destination for network-shaped approvals. Empty otherwise.
  string destination_host = 6;
  string destination_path = 7;
  // Header names and classes for network-shaped approvals; empty otherwise.
  repeated ApprovalHeader headers = 8;
  // Bounded environment variable NAMES only (values are never returned), for
  // HOST_COMMAND approvals. The daemon returns at most 64 names, each at most
  // 128 bytes. EnvNamesTruncated is set when more names exist.
  repeated string env_names = 9;
  bool env_names_truncated = 10;
  // Redacted working-directory summary for HOST_COMMAND approvals, at most 256
  // bytes. It is not an absolute host path.
  string cwd_summary = 11;
  int64 created_at_unix = 12;
}

// ApprovalService lists, inspects and resolves host-side approvals. A pending
// approval is only consent-gathering state. Listing or inspecting one never
// grants it.
service ApprovalService {
  rpc List(ApprovalServiceListRequest) returns (ApprovalServiceListResponse);
  rpc Inspect(ApprovalServiceInspectRequest) returns (ApprovalServiceInspectResponse);
  rpc Respond(ApprovalServiceRespondRequest) returns (ApprovalServiceRespondResponse);
}

// List returns pending approvals only. A non-empty SandboxId limits the result
// to approvals requested by that sandbox. The daemon bounds the queue size.
message ApprovalServiceListRequest {
  string sandbox_id = 1;
}

message ApprovalServiceListResponse {
  repeated Approval approvals = 1;
}

// Inspect returns one approval, including recently resolved ones within the
// daemon's retention window. A non-empty SandboxId that does not match the
// approval's sandbox returns NOT_FOUND.
message ApprovalServiceInspectRequest {
  string approval_id = 1;
  string sandbox_id = 2;
}

message ApprovalServiceInspectResponse {
  Approval approval = 1;
}

// Respond records a host-side decision. This RPC is not a consent grant by
// itself: the daemon must obtain consent through its trusted host approval
// provider and must never accept a boolean, challenge ID or caller identity as
// consent. A daemon without a trusted OS-backed provider MUST fail closed:
// it refuses every APPROVE and every EXACT persist with FAILED_PRECONDITION. It
// must not downgrade either to ONCE or to a silent DENY. DENY is always accepted
// for a pending approval. Decision UNSPECIFIED is INVALID_ARGUMENT, and
// PersistScope UNSPECIFIED means ONCE.
message ApprovalServiceRespondRequest {
  string approval_id = 1;
  ApprovalDecision decision = 2;
  ApprovalPersistScope persist_scope = 3;
}

message ApprovalServiceRespondResponse {
  Approval approval = 1;
  // PersistedRuleID is set only when an EXACT rule was stored.
  string persisted_rule_id = 2;
}

// KitSourceKind identifies the kind of a kit source reference. Unknown values
// must be rejected by daemons with INVALID_ARGUMENT (fail closed).
enum KitSourceKind {
  KIT_SOURCE_KIND_UNSPECIFIED = 0;
  KIT_SOURCE_KIND_DIRECTORY = 1;
  KIT_SOURCE_KIND_ZIP = 2;
  KIT_SOURCE_KIND_GIT = 3;
  KIT_SOURCE_KIND_OCI = 4;
}

// CheckKitReason is the stable outcome of a kit policy check. Daemons without a
// policy engine return CHECK_KIT_REASON_POLICY_UNAVAILABLE with allowed=false
// (fail closed). Org/managed deny is sticky: a managed deny is never relaxed by
// local settings.
enum CheckKitReason {
  CHECK_KIT_REASON_UNSPECIFIED = 0;
  CHECK_KIT_REASON_OK = 1;
  CHECK_KIT_REASON_SOURCE_NOT_ALLOWED = 2;
  CHECK_KIT_REASON_LOCAL_DISABLED = 3;
  CHECK_KIT_REASON_SIGNATURE_REQUIRED = 4;
  CHECK_KIT_REASON_POLICY_UNAVAILABLE = 5;
  CHECK_KIT_REASON_INVALID_REFERENCE = 6;
}

// CheckKitRequest asks the daemon whether a kit source may be installed or used.
// source_ref is a URL/path identifier ONLY: it must never carry content or
// credentials. Daemons reject references containing userinfo or a query string
// with CHECK_KIT_REASON_INVALID_REFERENCE. sandbox_id is optional and, when
// present, scopes the decision to that sandbox.
message CheckKitRequest {
  KitSourceKind source_kind = 1;
  // URL/path identifier ONLY. Never content, never credentials; userinfo/query
  // components are rejected daemon-side.
  string source_ref = 2;
  string sandbox_id = 3;
  bool signature_present = 4;
}

// CheckKitResponse is the daemon's fail-closed decision. allowed is false unless
// the policy explicitly permits the source. message is human-readable and must
// never contain secret material. checked_settings lists the setting names that
// decided the outcome (names only).
message CheckKitResponse {
  bool allowed = 1;
  CheckKitReason reason = 2;
  // Human-readable explanation. Redaction contract: no secret material, no
  // credentials, no source content.
  string message = 3;
  repeated string checked_settings = 4;
}

message GetKitPolicyConfigRequest {}

// GetKitPolicyConfigResponse exposes the effective kit policy for display. It is
// read-only. managed reports whether an organization policy overrides local
// settings; local settings may only TIGHTEN a managed policy (AGENTS.md §8),
// never relax it. No field carries secret material.
message GetKitPolicyConfigResponse {
  repeated KitSourceKind allowed_sources = 1;
  bool allow_local_kits = 2;
  bool require_signature = 3;
  bool managed = 4;
}

// KitPolicyService exposes the daemon's kit source policy for display and
// fail-closed checks. A daemon without a policy engine returns
// CHECK_KIT_REASON_POLICY_UNAVAILABLE with allowed=false from CheckKit.
service KitPolicyService {
  rpc CheckKit(CheckKitRequest) returns (CheckKitResponse);
  rpc GetKitPolicyConfig(GetKitPolicyConfigRequest) returns (GetKitPolicyConfigResponse);
}
